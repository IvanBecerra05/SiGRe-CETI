name: sigre_ceti
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  gal: ^2.3.2
  intl: ^0.20.2
  google_fonts: ^6.3.0
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/icon/logo.png
  fonts:
    - family: Domine 
      fonts:
        - asset: assets/fonts/Domine-Bold.ttf
        - asset: assets/fonts/Domine-Medium.ttf
        - asset: assets/fonts/Domine-Regular.ttf
        - asset: assets/fonts/Domine-SemiBold.ttf
          weight: 700